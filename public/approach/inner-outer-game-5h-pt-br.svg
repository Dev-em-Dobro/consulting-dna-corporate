    <text x="385" y="445" font-size="53">Quem somos</text><text x="385" y="525" font-size="53">e como agimos</text>
    <text x="1235" y="445" font-size="53">Resultados</text><text x="1235" y="525" font-size="53">para o negócio</text>
  </g>
