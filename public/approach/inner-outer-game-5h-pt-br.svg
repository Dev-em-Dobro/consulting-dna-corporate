<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 970" role="img" aria-labelledby="title desc">
  <title id="title">Jogo interior e jogo exterior</title><desc id="desc">As cinco dimensões da liderança conectam identidade e comportamento aos resultados de negócios.</desc>
